<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:40px 22px;
  background:#080808;color:#fff;font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:repeating-linear-gradient(118deg,#121212 0 14px,#0d0d0d 14px 28px)}
.wrap{position:relative;width:100%;max-width:620px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
.glow{position:absolute;top:-120px;left:50%;transform:translateX(-50%) skewX(-13deg);width:340px;height:340px;
  background:radial-gradient(closest-side,rgba(227,6,19,.4),rgba(227,6,19,0));pointer-events:none}
img.logo{position:relative;width:min(330px,74vw);height:auto;display:block}
.code{position:relative;margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;
  font-size:clamp(74px,19vw,132px);line-height:.9;letter-spacing:.02em;
  background:linear-gradient(96deg,#E30613,#FF3D00 68%,#FFD600);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{position:relative;margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;
  font-size:clamp(26px,5.4vw,38px);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
p{position:relative;margin:0;max-width:46ch;font-size:15px;line-height:1.7;color:#B5B5B5}
.actions{position:relative;display:flex;flex-wrap:wrap;gap:13px;justify-content:center}
a.btn{padding:16px 28px;border-radius:2px;font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s,color .2s,background .2s}
a.primary{background:linear-gradient(100deg,#E30613,#FF3D00);color:#fff}
a.primary:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(227,6,19,.45)}
a.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
a.ghost:hover{border-color:#FFD600;color:#FFD600;background:rgba(255,214,0,.06)}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}a.primary:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="glow"></div>

    <a class="btn primary" href="/">Ir al inicio</a>
    <a class="btn ghost" href="https://wa.me/50489237707" target="_blank" rel="noopener">Escribir por WhatsApp</a>
  </div>
</main>
</body>
